<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chroma Tree · 彩叶二维码</title>
<style>
  :root {
    --paper-1: #ece8d9;
    --paper-2: #f1e8cf;
    --paper-3: #e5d6b7;
    --ink: #3b3529;
    --muted: #8a806c;
    --line: #ddd4c0;
    --card: #fffdf6;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: linear-gradient(var(--paper-1), var(--paper-2) 40%, var(--paper-3));
    min-height: 100vh;
    color: var(--ink);
    padding: 40px 16px;
  }
  .shell { max-width: 720px; margin: 0 auto; }

  header { text-align: center; margin-bottom: 26px; }
  .eyebrow { color: #d4687f; letter-spacing: 3px; font-size: 12px; margin-bottom: 12px; }
  .eyebrow::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #d4687f; margin-right: 8px; vertical-align: 1px; }
  h1 { font-size: 32px; font-weight: 700; letter-spacing: 1px; margin-bottom: 8px; }
  .sub { color: var(--muted); font-size: 14px; }

  .stage {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 12px 32px rgba(60, 50, 30, .08);
    margin-bottom: 22px;
  }
  .toolbar {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 16px; border-bottom: 1px solid var(--line);
  }
  .stage-label { font-size: 12px; letter-spacing: 2px; color: var(--muted); text-transform: uppercase; }
  .toggle {
    border: 1px solid var(--line); background: #fff; border-radius: 999px;
    padding: 6px 13px; cursor: pointer; font-size: 13px; color: var(--ink);
    transition: border-color .15s, background .15s;
  }
  .toggle:hover { border-color: var(--ink); }
  .canvas-wrap {
    display: flex; justify-content: center; align-items: center;
    padding: 0; min-height: 320px;
    background: linear-gradient(var(--paper-1), var(--paper-2) 62%, var(--paper-3));
  }
  .canvas-wrap canvas { display: block; max-width: 100%; height: auto; }

  .panel {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 20px;
    box-shadow: 0 12px 32px rgba(60, 50, 30, .08);
  }
  .field-label { font-size: 13px; color: var(--muted); display: block; margin-bottom: 6px; }
  input[type=text] {
    width: 100%; padding: 12px 14px; font-size: 15px;
    border: 1px solid var(--line); border-radius: 10px; margin-bottom: 18px;
    outline: none; background: #fff; color: var(--ink);
    transition: border-color .15s;
  }
  input[type=text]:focus { border-color: #d4687f; }
  legend { font-size: 13px; color: var(--muted); padding: 0 6px; margin-bottom: 10px; }
  .themes { display: flex; gap: 10px; flex-wrap: wrap; }
  .theme {
    display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px;
    border: 1px solid var(--line); border-radius: 999px; background: #fff;
    cursor: pointer; font-size: 13px; color: var(--ink);
    transition: border-color .15s, transform .1s;
  }
  .theme:hover { border-color: var(--ink); }
  .theme.active { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
  .swatch { width: 15px; height: 15px; border-radius: 50%; display: inline-block; }
  .swatch.cherry  { background: #f4b2cc; }
  .swatch.summer  { background: #91c96a; }
  .swatch.ginkgo  { background: #f4d94e; }
  .swatch.rainbow { background: conic-gradient(#f58fbd, #ef5350, #f7943d, #f2d54a, #54c7c2, #4fa66d, #f58fbd); }

  .actions { display: flex; gap: 10px; margin-top: 20px; flex-wrap: wrap; }
  .actions a {
    flex: 1 1 0; text-align: center; padding: 11px 14px; border-radius: 10px;
    font-size: 14px; text-decoration: none; color: var(--ink);
    border: 1px solid var(--line); background: #fff; white-space: nowrap;
    transition: background .15s, border-color .15s;
  }
  .actions a:hover { border-color: var(--ink); }
  .actions a.primary { background: var(--ink); color: #fff; border-color: var(--ink); }
  .actions a.primary:hover { background: #4a4234; }

  footer { text-align: center; margin-top: 22px; font-size: 12px; color: var(--muted); }
  footer .sep { margin: 0 8px; opacity: .5; }

  /* 自定义配色弹窗 */
  .swatch.custom { background: linear-gradient(90deg, #ef5350, #f2d54a, #4fa66d, #54c7c2); }
  .modal { position: fixed; inset: 0; background: rgba(40,32,20,.42); display: none; align-items: center; justify-content: center; padding: 20px; z-index: 50; }
  .modal.open { display: flex; }
  .modal-card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 24px; width: 100%; max-width: 460px; box-shadow: 0 20px 60px rgba(40,32,20,.28); }
  .modal-card h2 { font-size: 20px; margin-bottom: 4px; }
  .modal-card .hint { font-size: 13px; color: var(--muted); margin-bottom: 16px; }
  .track-label { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
  .track-label .count { font-size: 12px; color: var(--muted); }
  .track { height: 26px; border-radius: 8px; border: 1px solid var(--line); margin-bottom: 10px; overflow: hidden; }
  .swatches { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; min-height: 34px; }
  .custom-swatch { width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--line); cursor: pointer; position: relative; }
  .custom-swatch:hover::after { content: "×"; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 18px; background: rgba(0,0,0,.35); border-radius: 8px; }
  .add-row { display: flex; gap: 8px; align-items: center; margin-bottom: 14px; }
  .add-row input[type=color] { width: 42px; height: 42px; padding: 0; border: 1px solid var(--line); border-radius: 8px; background: #fff; cursor: pointer; flex: none; }
  .add-row input[type=text] { flex: 1; padding: 10px 12px; font-size: 14px; border: 1px solid var(--line); border-radius: 8px; margin: 0; font-family: ui-monospace, "SFMono-Regular", Consolas, monospace; }
  .add-row button { padding: 10px 16px; border: 1px solid var(--ink); background: var(--ink); color: #fff; border-radius: 8px; cursor: pointer; font-size: 14px; flex: none; }
  .gradient-opt { display: flex; align-items: center; gap: 8px; font-size: 14px; margin: 4px 0; cursor: pointer; user-select: none; }
  .gradient-opt input { width: 16px; height: 16px; }
  .gradient-opt .dim { color: var(--muted); font-size: 12px; }
  .error { color: #c0392b; font-size: 13px; min-height: 18px; margin: 8px 0 4px; }
  .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-actions button { padding: 10px 18px; border: 1px solid var(--line); background: #fff; border-radius: 8px; cursor: pointer; font-size: 14px; }
  .modal-actions .primary-btn { background: var(--ink); color: #fff; border-color: var(--ink); }

  .toolbar-actions { display: flex; gap: 8px; }

  /* 选择对应方块 */
  .block-map { display: flex; flex-direction: column; gap: 10px; }
  .block-row { display: flex; align-items: center; gap: 10px; font-size: 14px; }
  .color-dot { width: 20px; height: 20px; border-radius: 5px; border: 1px solid var(--line); flex: none; }
  .block-row .hex { font-family: ui-monospace, Consolas, monospace; font-size: 13px; width: 82px; }
  .block-row .arrow { color: var(--muted); }
  .block-pick { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border: 1px solid var(--line); border-radius: 999px; background: #fff; cursor: pointer; font-size: 13px; color: var(--ink); }
  .block-pick:hover { border-color: var(--ink); }
  .block-icon { width: 16px; height: 16px; border-radius: 3px; border: 1px solid rgba(0,0,0,.15); display: inline-block; flex: none; }

  /* 方块选择下拉 */
  .block-modal-card { max-width: 480px; }
  #block-search { width: 100%; padding: 10px 12px; font-size: 14px; border: 1px solid var(--line); border-radius: 8px; margin-bottom: 12px; outline: none; }
  #block-search:focus { border-color: #d4687f; }
  .block-list { max-height: 340px; overflow-y: auto; border: 1px solid var(--line); border-radius: 8px; }
  .block-option { display: flex; align-items: center; gap: 10px; padding: 8px 12px; cursor: pointer; font-size: 14px; }
  .block-option:hover { background: #f4efe4; }
  .block-option .bname { flex: 1; }
  .block-option code { font-size: 11px; color: var(--muted); }
  .block-empty { padding: 16px; text-align: center; color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
  <main class="shell">
    <header>
      <div class="eyebrow">CHROMA TREE · 彩叶二维码</div>
      <h1>种下一个链接</h1>
      <p class="sub">输入完整网址，下方会实时生成对应的树。点击「查看二维码」可俯视并扫描。</p>
    </header>

    <section class="stage">
      <div class="toolbar">
        <span class="stage-label" id="stage-label">樱花树</span>
        <div class="toolbar-actions">
          <button type="button" class="toggle" id="toggle"><span>⌗</span> 查看二维码</button>
        </div>
      </div>
      <div class="canvas-wrap">
        <canvas id="preview" role="img" aria-label="二维码树"></canvas>
      </div>
    </section>

    <section class="panel">
      <label class="field-label" for="url">想种下什么链接？</label>
      <input type="text" id="url" placeholder="https://example.com" inputmode="url" spellcheck="false" value="https://openai.com">

      <fieldset style="border: none;">
        <legend>选择树叶颜色</legend>
        <div class="themes">
          <button type="button" class="theme active" data-theme="cherry"><span class="swatch cherry"></span>樱花粉</button>
          <button type="button" class="theme" data-theme="summer"><span class="swatch summer"></span>夏日绿</button>
          <button type="button" class="theme" data-theme="ginkgo"><span class="swatch ginkgo"></span>银杏黄</button>
          <button type="button" class="theme" data-theme="rainbow"><span class="swatch rainbow"></span>渐变彩虹</button>
          <button type="button" class="theme" data-theme="custom"><span class="swatch custom"></span>自定义配色</button>
        </div>
      </fieldset>

      <fieldset style="border: none; margin-top: 18px;">
        <legend>选择对应方块</legend>
        <div class="block-map" id="block-map"></div>
      </fieldset>

      <div class="actions">
        <a class="primary" id="download" href="#">下载当前视图</a>
        <a id="download-flat" href="#">下载可扫描二维码</a>
        <a id="download-projection" href="#">下载投影文件</a>
      </div>
    </section>

    <footer>
      <span>每片颜色，都是二维码的一部分</span>
      <span class="sep">·</span>
      <span>俯视图（查看二维码）即可扫描</span>
    </footer>
  </main>

  <div class="modal" id="custom-modal">
    <div class="modal-card">
      <h2>自定义配色</h2>
      <p class="hint">颜色从下到上铺在叶片上，最多 6 种。</p>

      <div class="track-label">
        <span class="field-label" style="margin:0">颜色轨道</span>
        <span class="count" id="custom-count">3 / 6</span>
      </div>
      <div class="track" id="custom-track"></div>
      <div class="swatches" id="custom-swatches"></div>

      <label class="field-label">添加颜色（点击色块可移除）</label>
      <div class="add-row">
        <input type="color" id="custom-picker" value="#65D97D">
        <input type="text" id="custom-hex" placeholder="#65D97D" maxlength="7" spellcheck="false">
        <button type="button" id="custom-add">添加</button>
      </div>

      <label class="gradient-opt">
        <input type="checkbox" id="custom-gradient" checked>
        <span>渐变过渡</span>
        <span class="dim">（不勾选则颜色之间直接分块应用）</span>
      </label>

      <p class="error" id="custom-error"></p>

      <div class="modal-actions">
        <button type="button" id="custom-cancel">取消</button>
        <button type="button" id="custom-apply" class="primary-btn">应用</button>
      </div>
    </div>
  </div>

  <div class="modal" id="block-modal">
    <div class="modal-card block-modal-card">
      <h2>选择方块</h2>
      <input type="text" id="block-search" placeholder="搜索方块名称或 id（如：染色玻璃 / white_stained_glass）" spellcheck="false">
      <div class="block-list" id="block-list"></div>
    </div>
  </div>

  <script>
// Minecraft 方块库（精选常用方块）。每项：{ id, name, color }
// `color` 是该方块的代表色，用于界面色块与投影预览（非真实贴图）。
// 搜索支持：中文名、方块 id（如 "white_stained_glass" 或 "minecraft:white_stained_glass"）。
(function (global) {
  var DYE = {
    white: ['#F0F0F0', '白色'], orange: ['#F9801D', '橙色'], magenta: ['#C74EBD', '品红色'],
    light_blue: ['#3AB3DA', '淡蓝色'], yellow: ['#FED83D', '黄色'], lime: ['#80C71F', '黄绿色'],
    pink: ['#F38BAA', '粉红色'], gray: ['#474F52', '灰色'], light_gray: ['#9D9D97', '淡灰色'],
    cyan: ['#169C9C', '青色'], purple: ['#8932B8', '紫色'], blue: ['#3C44AA', '蓝色'],
    brown: ['#835432', '棕色'], green: ['#5E7C16', '绿色'], red: ['#B02E26', '红色'],
    black: ['#1D1D21', '黑色']
  };

  var blocks = [];

  // 16 色染色系列（染色玻璃 / 混凝土 / 羊毛 / 陶瓦 / 混凝土粉末）
  var FAMILIES = {
    stained_glass: '染色玻璃', concrete: '混凝土', wool: '羊毛',
    terracotta: '陶瓦', concrete_powder: '混凝土粉末'
  };
  Object.keys(FAMILIES).forEach(function (fam) {
    Object.keys(DYE).forEach(function (key) {
      blocks.push({ id: 'minecraft:' + key + '_' + fam, name: DYE[key][1] + FAMILIES[fam], color: DYE[key][0] });
    });
  });

  // 常用固体方块
  var SOLID = [
    ['minecraft:stone', '石头', '#7F7F7F'], ['minecraft:cobblestone', '圆石', '#6F6F6F'],
    ['minecraft:stone_bricks', '石砖', '#7A7A7A'], ['minecraft:mossy_stone_bricks', '苔石砖', '#6B7A5A'],
    ['minecraft:cracked_stone_bricks', '裂纹石砖', '#757575'], ['minecraft:granite', '花岗岩', '#8C6B5E'],
    ['minecraft:diorite', '闪长岩', '#BDBDBD'], ['minecraft:andesite', '安山岩', '#8C8C8C'],
    ['minecraft:deepslate', '深板岩', '#4A4A4A'], ['minecraft:cobbled_deepslate', '深板岩圆石', '#4E4E4E'],
    ['minecraft:tuff', '凝灰岩', '#6E6E6A'], ['minecraft:calcite', '方解石', '#D6D4CB'],
    ['minecraft:basalt', '玄武岩', '#3D3D3D'], ['minecraft:blackstone', '黑石', '#2E2E2E'],
    ['minecraft:obsidian', '黑曜石', '#191219'], ['minecraft:bedrock', '基岩', '#3D3D3D'],
    ['minecraft:dirt', '泥土', '#966C4A'], ['minecraft:grass_block', '草方块', '#7CB342'],
    ['minecraft:sand', '沙子', '#DBD3A0'], ['minecraft:red_sand', '红沙', '#C27A3A'],
    ['minecraft:sandstone', '砂岩', '#D6C98F'], ['minecraft:gravel', '沙砾', '#7F7F7F'],
    ['minecraft:snow_block', '雪块', '#F4FBFD'], ['minecraft:ice', '冰', '#7FB8FF'],
    ['minecraft:packed_ice', '浮冰', '#8CB4FF'], ['minecraft:blue_ice', '蓝冰', '#6E9FFF'],
    ['minecraft:glass', '玻璃', '#C8D8E0'],
    ['minecraft:oak_log', '橡木原木', '#6B5232'], ['minecraft:oak_planks', '橡木木板', '#B8945F'],
    ['minecraft:spruce_log', '云杉原木', '#3B2A16'], ['minecraft:spruce_planks', '云杉木板', '#6E512E'],
    ['minecraft:birch_log', '白桦原木', '#D7C8A0'], ['minecraft:birch_planks', '白桦木板', '#C6B07A'],
    ['minecraft:jungle_log', '丛林原木', '#6E4F2D'], ['minecraft:jungle_planks', '丛林木板', '#B08D5B'],
    ['minecraft:acacia_log', '金合欢原木', '#5F5342'], ['minecraft:acacia_planks', '金合欢木板', '#B46237'],
    ['minecraft:dark_oak_log', '深色橡木原木', '#3A2B18'], ['minecraft:dark_oak_planks', '深色橡木木板', '#503D28'],
    ['minecraft:mangrove_log', '红树原木', '#6E3E2E'], ['minecraft:cherry_log', '樱花原木', '#D9A7A0'],
    ['minecraft:cherry_planks', '樱花木板', '#E8C6B8'],
    ['minecraft:oak_leaves', '橡树树叶', '#4C7A2E'], ['minecraft:spruce_leaves', '云杉树叶', '#3B5F2A'],
    ['minecraft:birch_leaves', '白桦树叶', '#6E8A3E'], ['minecraft:jungle_leaves', '丛林树叶', '#2E6E2E'],
    ['minecraft:acacia_leaves', '金合欢树叶', '#4C7A2E'], ['minecraft:dark_oak_leaves', '深色橡树树叶', '#3B5F2A'],
    ['minecraft:coal_ore', '煤矿石', '#3A3A3A'], ['minecraft:iron_ore', '铁矿石', '#C7B199'],
    ['minecraft:copper_ore', '铜矿石', '#A98A6E'], ['minecraft:gold_ore', '金矿石', '#D8B95E'],
    ['minecraft:redstone_ore', '红石矿石', '#A64A3E'], ['minecraft:lapis_ore', '青金石矿石', '#3A5FA0'],
    ['minecraft:diamond_ore', '钻石矿石', '#8FD8D8'], ['minecraft:emerald_ore', '绿宝石矿石', '#2E7A2E'],
    ['minecraft:nether_quartz_ore', '下界石英矿石', '#B8A89E'], ['minecraft:ancient_debris', '远古残骸', '#6E4E3A'],
    ['minecraft:coal_block', '煤炭块', '#2E2E2E'], ['minecraft:iron_block', '铁块', '#D8D8D8'],
    ['minecraft:copper_block', '铜块', '#C77B5B'], ['minecraft:gold_block', '金块', '#E8C84A'],
    ['minecraft:redstone_block', '红石块', '#A42E1E'], ['minecraft:lapis_block', '青金石块', '#2A4A9A'],
    ['minecraft:diamond_block', '钻石块', '#7BD8D8'], ['minecraft:emerald_block', '绿宝石块', '#2EC56E'],

    ['minecraft:glowstone', '荧石', '#E8C878'], ['minecraft:sea_lantern', '海晶灯', '#9CBFA8'],
    ['minecraft:shroomlight', '菌光体', '#E8A878'], ['minecraft:jack_o_lantern', '南瓜灯', '#D8A038'],
    ['minecraft:pumpkin', '南瓜', '#C08038'], ['minecraft:melon', '西瓜', '#7A9A3E'],
    ['minecraft:brick', '红砖', '#9A4E3E'], ['minecraft:nether_bricks', '下界砖块', '#3A1E1E'],
    ['minecraft:prismarine', '海晶石', '#5E9A8A'], ['minecraft:purpur_block', '紫珀块', '#A88A9E'],
    ['minecraft:end_stone', '末地石', '#D8D8A8'], ['minecraft:magma_block', '岩浆块', '#6E3E2E'],
    ['minecraft:slime_block', '史莱姆块', '#6EBA5E'], ['minecraft:honey_block', '蜂蜜块', '#E8A848'],
    ['minecraft:moss_block', '苔藓块', '#4E7A3E'], ['minecraft:bone_block', '骨块', '#D8D0B0'],
    ['minecraft:hay_block', '干草块', '#C8A838'], ['minecraft:bookshelf', '书架', '#8A6E4E'],
    ['minecraft:crafting_table', '工作台', '#7A5E3E'], ['minecraft:furnace', '熔炉', '#6E6E6E'],
    ['minecraft:chest', '箱子', '#8A6E3E'], ['minecraft:barrel', '木桶', '#7A5E3E'],
    ['minecraft:shulker_box', '潜影盒', '#8A5E9E'], ['minecraft:lantern', '灯笼', '#C8A048'],
    ['minecraft:torch', '火把', '#C8A048']
  ];
  SOLID.forEach(function (b) { blocks.push({ id: b[0], name: b[1], color: b[2] }); });

  global.MC_BLOCKS = blocks;
})(window);

</script>

    g.addColorStop(0, 'rgba(41,71,56,' + alpha.toFixed(3) + ')');
    g.addColorStop(1, 'rgba(41,71,56,0)');
    ctx.fillStyle = g;
    ctx.fillRect(-rx, -rx, rx * 2, rx * 2);
    ctx.restore();
  }

  function drawTree(ctx, x, now) {
    var n = state.matrix.length;
    var T = (n - 1) / 2;
    var E = Math.min(W, H) / Math.max(n * 1.45, 36);
    var D = Math.floor(Math.min(W * 0.7, H * 0.73) / (n + 8));
    var rot = -0.74 + Math.sin(now / 5000) * 0.025 + state.pointer.x * 0.09 * (1 - x);

    drawShadow(ctx, x, rot, n, E);

    var swayPhase = now / 1200;
    var proj = state.blocks.map(function (b) {
      var cx = b.x - T, cz = b.z - T;
      var px = cx * Math.cos(rot) - cz * Math.sin(rot);
      var pz = cx * Math.sin(rot) + cz * Math.cos(rot);
      var leafSway = b.kind === 'leaf' ? Math.sin(swayPhase + b.jitter * 8) * 0.08 * (1 - x) : 0;
      var isoX = W / 2 + (px + leafSway) * E;
      var isoY = H * 0.7 + pz * E * 0.46 - b.y * E * 0.86 + state.pointer.y * E * 0.7 * (1 - x);
      var flatX = W / 2 + cx * D;
      var flatY = H / 2 + cz * D;
      return { b: b, sx: lerp(isoX, flatX, x), sy: lerp(isoY, flatY, x), depth: pz + b.y * 0.06 };
    });

    proj.sort(function (a, b) {
      if (a.b.extra !== b.b.extra) return a.b.extra ? 1 : -1;
      return (a.depth - b.depth) || (a.b.y - b.b.y);
    });

    var size = lerp(E * 1.03, D, x);
    var hgt = size * 0.5 * (1 - x);

    for (var i = 0; i < proj.length; i++) {
      drawBlock(ctx, proj[i].sx, proj[i].sy, size, hgt, blockColor(proj[i].b, x), x);
    }
  }

  // Final top-down QR (scannable): plain dark squares on a light background.
  function drawFlat(ctx) {
    var n = state.matrix.length;
    var D = Math.floor(Math.min(W * 0.7, H * 0.73) / (n + 8));
    var total = D * (n + 8);
    var ox = Math.round((W - total) / 2);
    var oy = Math.round((H - total) / 2);
    for (var r = 0; r < n; r++) {
      for (var c = 0; c < n; c++) {
        if (!state.matrix[r][c]) continue;
        ctx.fillStyle = flatColor(state.cellBlock[r][c]);
        ctx.fillRect(ox + (c + 4) * D, oy + (r + 4) * D, D, D);
      }
    }
  }

  function paint(ctx, x, now) {
    drawBackground(ctx, x);
    if (x > 0.985) drawFlat(ctx);
    else drawTree(ctx, x, now);
  }

  // ---- state + DOM -------------------------------------------------------

  var state = {
    url: 'https://openai.com',
    theme: 'cherry',
    flat: false,      // target: false = tree, true = flat
    s: 0,             // eased progress 0..1
    pointer: { x: 0, y: 0 },
    matrix: null,
    blocks: null,
    cellBlock: null,
    customColors: ['#65D97D', '#f4d94e', '#ef91b4'],
    customGradient: true,
    blockMap: {} // 颜色(小写) -> 方块 id
  };

  var canvas = document.getElementById('preview');
  var ctx = canvas.getContext('2d');
  var urlInput = document.getElementById('url');
  var stageLabel = document.getElementById('stage-label');
  var toggleBtn = document.getElementById('toggle');
  var download = document.getElementById('download');
  var downloadFlat = document.getElementById('download-flat');
  var themeButtons = Array.prototype.slice.call(document.querySelectorAll('.theme'));

  canvas.width = W;
  canvas.height = H;

  function rebuild() {
    try {
      state.matrix = getMatrix(state.url);
      var scene = buildScene(state.matrix);
      state.blocks = scene.blocks;
      state.cellBlock = scene.cellBlock;
    } catch (e) {
      // Too long / invalid: keep the previous scene.
    }
  }

  function render() {
    if (!state.url) return;
    rebuild();
    stageLabel.textContent = state.flat ? 'SCAN ME' : THEMES[state.theme].treeLabel;
    toggleBtn.innerHTML = state.flat
      ? '<span>↙</span> 回到' + THEMES[state.theme].treeLabel
      : '<span>⌗</span> 查看二维码';
    themeButtons.forEach(function (b) {
      b.classList.toggle('active', b.getAttribute('data-theme') === state.theme);
    });
    renderBlockMap();
  }

  function exportPng(flat) {
    var off = document.createElement('canvas');
    off.width = W; off.height = H;
    var octx = off.getContext('2d');
    paint(octx, flat ? 1 : 0, 0);
    return off.toDataURL('image/png');
  }

  // ---- events ------------------------------------------------------------

  var debounce;
  urlInput.addEventListener('input', function () {
    state.url = urlInput.value.trim();
    clearTimeout(debounce);
    debounce = setTimeout(render, 250);
  });
  toggleBtn.addEventListener('click', function () {
    state.flat = !state.flat;
    render();
  });
  themeButtons.forEach(function (b) {
    b.addEventListener('click', function () {
      var t = b.getAttribute('data-theme');
      if (t === 'custom') { openModal(); return; }
      state.theme = t;
      render();
    });
  });
  // ---- custom colour modal ----
  var modal = document.getElementById('custom-modal');
  var hexInput = document.getElementById('custom-hex');
  var colorPicker = document.getElementById('custom-picker');
  var addBtn = document.getElementById('custom-add');
  var applyBtn = document.getElementById('custom-apply');
  var cancelBtn = document.getElementById('custom-cancel');
  var gradientChk = document.getElementById('custom-gradient');
  var trackEl = document.getElementById('custom-track');
  var swatchesEl = document.getElementById('custom-swatches');
  var customError = document.getElementById('custom-error');
  var customCount = document.getElementById('custom-count');

  function showError(msg) { customError.textContent = msg; }

  function renderCustomUI() {
    showError('');
    var colors = state.customColors;
    var n = colors.length;
    if (n === 0) {
      trackEl.style.background = 'rgba(0,0,0,.06)';
    } else if (state.customGradient) {
      trackEl.style.background = 'linear-gradient(to right, ' + colors.join(', ') + ')';
    } else {
      var stops = [];
      for (var i = 0; i < n; i++) {
        stops.push(colors[i] + ' ' + (i / n * 100).toFixed(1) + '%');
        stops.push(colors[i] + ' ' + ((i + 1) / n * 100).toFixed(1) + '%');
      }
      trackEl.style.background = 'linear-gradient(to right, ' + stops.join(', ') + ')';
    }
    swatchesEl.innerHTML = '';
    colors.forEach(function (c, i) {
      var s = document.createElement('span');
      s.className = 'custom-swatch';
      s.style.background = c;
      s.title = '点击移除 ' + c;
      s.addEventListener('click', function () {
        state.customColors.splice(i, 1);
        renderCustomUI();
      });
      swatchesEl.appendChild(s);
    });
    gradientChk.checked = state.customGradient;
    customCount.textContent = n + ' / 6';
  }

  function addColor() {
    var v = hexInput.value.trim();
    if (!/^#?[0-9a-fA-F]{6}$/.test(v)) { showError('请输入 6 位十六进制颜色，如 #65D97D'); return; }
    if (v.charAt(0) !== '#') v = '#' + v;
    v = v.toUpperCase();
    if (state.customColors.length >= 6) { showError('最多只能添加 6 种颜色'); return; }
    state.customColors.push(v);
    hexInput.value = '';
    renderCustomUI();
  }

  function openModal() { renderCustomUI(); modal.classList.add('open'); }
  function closeModal() { modal.classList.remove('open'); }

  addBtn.addEventListener('click', addColor);
  hexInput.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); addColor(); } });
  colorPicker.addEventListener('input', function () { hexInput.value = colorPicker.value; });
  gradientChk.addEventListener('change', function () { state.customGradient = gradientChk.checked; renderCustomUI(); });
  applyBtn.addEventListener('click', function () {
    if (state.customColors.length === 0) { showError('请先添加至少一种颜色'); return; }
    state.theme = 'custom';
    closeModal();
    render();
  });
  cancelBtn.addEventListener('click', closeModal);
  modal.addEventListener('click', function (e) { if (e.target === modal) closeModal(); });

  function triggerDownload(href, filename) {
    var a = document.createElement('a');
    a.href = href;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  }
  download.addEventListener('click', function (e) {
    e.preventDefault();
    triggerDownload(exportPng(state.flat), state.flat ? 'pixel-tree-qr.png' : 'pixel-tree.png');
  });
  downloadFlat.addEventListener('click', function (e) {
    e.preventDefault();
    triggerDownload(exportPng(true), 'pixel-tree-qr.png');
  });
  canvas.parentElement.addEventListener('pointermove', function (e) {
    var rect = canvas.getBoundingClientRect();
    state.pointer.x = (e.clientX - rect.left) / rect.width - 0.5;
    state.pointer.y = (e.clientY - rect.top) / rect.height - 0.5;
  });
  canvas.parentElement.addEventListener('pointerleave', function () {
    state.pointer.x = 0; state.pointer.y = 0;
  });

  // ---- animation loop ----------------------------------------------------

  // ===== Minecraft 方块映射 / 投影预览 / Litematica 导出 =====

  var downloadProjectionBtn = document.getElementById('download-projection');
  var blockMapEl = document.getElementById('block-map');
  var blockModal = document.getElementById('block-modal');
  var blockSearch = document.getElementById('block-search');
  var blockListEl = document.getElementById('block-list');
  var STAINED_GLASS = null;
  var activeBlockKey = null;

  function getBlock(id) {
    if (!id) return null;
    for (var i = 0; i < MC_BLOCKS.length; i++) if (MC_BLOCKS[i].id === id) return MC_BLOCKS[i];
    return null;
  }

  function closestStainedGlass(hex) {
    if (!STAINED_GLASS) STAINED_GLASS = MC_BLOCKS.filter(function (b) { return /_stained_glass$/.test(b.id); });
    var t = hexToRgb(hex), best = STAINED_GLASS[0], bd = Infinity;
    STAINED_GLASS.forEach(function (b) {
      var c = hexToRgb(b.color);
      var d = (c.r - t.r) * (c.r - t.r) + (c.g - t.g) * (c.g - t.g) + (c.b - t.b) * (c.b - t.b);
      if (d < bd) { bd = d; best = b; }
    });
    return best;
  }

  function leafPalette() {
    return state.theme === 'custom' ? state.customColors : THEMES[state.theme].top;
  }

  function leafBlock(b) {
    var pal = leafPalette();
    var n = pal.length;
    if (n === 0) return null;
    var band = Math.min(Math.floor(leafPos(b) * n), n - 1);
    return getBlock(state.blockMap[pal[band].toLowerCase()]);
  }

  function ensureBlockMap() {
    leafPalette().forEach(function (c) {
      var k = c.toLowerCase();
      if (!state.blockMap[k]) state.blockMap[k] = closestStainedGlass(c).id;
    });
  }

  // --- 选择对应方块 UI ---
  function renderBlockMap() {
    ensureBlockMap();
    var pal = leafPalette();
    blockMapEl.innerHTML = '';
    pal.forEach(function (c) {
      var k = c.toLowerCase();
      var blk = getBlock(state.blockMap[k]) || closestStainedGlass(c);
      var row = document.createElement('div');
      row.className = 'block-row';
      row.innerHTML =
        '<span class="color-dot" style="background:' + c + '"></span>' +
        '<code class="hex" style="color:' + c + '">' + c + '</code>' +
        '<span class="arrow">——</span>' +
        '<button type="button" class="block-pick"><span class="block-icon" style="background:' + blk.color + '"></span><span>' + blk.name + '</span></button>';
      row.querySelector('.block-pick').addEventListener('click', function () { openBlockModal(k); });
      blockMapEl.appendChild(row);
    });
  }

  function renderBlockList(q) {
    q = (q || '').toLowerCase();
    var list = MC_BLOCKS.filter(function (b) {
      return !q || b.name.toLowerCase().indexOf(q) !== -1 || b.id.toLowerCase().indexOf(q) !== -1;
    }).slice(0, 80);
    blockListEl.innerHTML = '';
    if (!list.length) blockListEl.innerHTML = '<div class="block-empty">未找到匹配的方块</div>';
    list.forEach(function (b) {
      var item = document.createElement('div');
      item.className = 'block-option';
      item.innerHTML = '<span class="block-icon" style="background:' + b.color + '"></span><span class="bname">' + b.name + '</span><code>' + b.id + '</code>';
      item.addEventListener('click', function () {
        state.blockMap[activeBlockKey] = b.id;
        blockModal.classList.remove('open');
        renderBlockMap();
      });
      blockListEl.appendChild(item);
    });
  }

  function openBlockModal(key) {
    activeBlockKey = key;
    blockSearch.value = '';
    renderBlockList('');
    blockModal.classList.add('open');
    blockSearch.focus();
  }

  blockSearch.addEventListener('input', function () { renderBlockList(blockSearch.value); });
  blockModal.addEventListener('click', function (e) { if (e.target === blockModal) blockModal.classList.remove('open'); });

  // --- Litematica (.litematic) 生成 ---
  var SCHEMATIC_VERSION = 7; // Litematica 原理图版本（MC 1.20.5+ 为 7）
  var DATA_VERSION = 4189;   // Minecraft 数据版本（可调整）

  function buildMinecraftGrid() {
    var n = state.matrix.length;
    var maxY = 0;
    state.blocks.forEach(function (b) { if (b.y > maxY) maxY = b.y; });
    var sizeY = maxY + 1;
    var grid = new Map();
    state.blocks.forEach(function (b) {
      var id;
      if (!b.extra) {
        id = (b.kind === 'soil' || b.kind === 'shadow-soil') ? 'minecraft:white_concrete' : 'minecraft:black_concrete';
      } else if (b.kind === 'leaf') {
        var blk = leafBlock(b);
        id = blk ? blk.id : 'minecraft:white_stained_glass';
      } else {
        id = 'minecraft:oak_log'; // 树干
      }
      if (id !== 'minecraft:air') grid.set((b.y * n * n) + (b.z * n) + b.x, id);
    });
    return { sizeX: n, sizeY: sizeY, sizeZ: n, grid: grid };
  }

  // --- NBT 编码（大端） ---
  function NBT() { this.b = []; }
  NBT.prototype.u8 = function (v) { this.b.push(v & 0xff); };
  NBT.prototype.u16 = function (v) { this.b.push((v >>> 8) & 0xff, v & 0xff); };
  NBT.prototype.i32 = function (v) { this.b.push((v >>> 24) & 0xff, (v >>> 16) & 0xff, (v >>> 8) & 0xff, v & 0xff); };
  NBT.prototype.i64 = function (v) {
    var x = BigInt.asIntN(64, typeof v === 'bigint' ? v : BigInt(v));
    for (var i = 56; i >= 0; i -= 8) this.b.push(Number((x >> BigInt(i)) & 0xffn));
  };
  NBT.prototype.str = function (s) {
    var e = new TextEncoder().encode(s);
    this.u16(e.length);
    for (var i = 0; i < e.length; i++) this.b.push(e[i]);
  };
  NBT.prototype.out = function () { return new Uint8Array(this.b); };

  function buildLitematicBytes() {
    var m = buildMinecraftGrid();
    var palette = ['minecraft:air'];
    var index = { 'minecraft:air': 0 };
    var used = new Set();
    m.grid.forEach(function (id) { used.add(id); });
    Array.from(used).sort().forEach(function (id) { index[id] = palette.length; palette.push(id); });

    var bits = Math.max(2, Math.ceil(Math.log2(palette.length)));
    var total = m.sizeX * m.sizeY * m.sizeZ;
    var longCount = Math.ceil(total * bits / 64);
    var longs = new Array(longCount).fill(0n);
    var MASK = (1n << BigInt(bits)) - 1n;
    m.grid.forEach(function (id, pos) {
      var val = BigInt(index[id]) & MASK;
      var bp = BigInt(pos) * BigInt(bits);
      var li = Number(bp >> 6n);
      var off = Number(bp & 63n);
      longs[li] = (longs[li] | (val << BigInt(off))) & 0xffffffffffffffffn;
      if (off + bits > 64) longs[li + 1] = (longs[li + 1] | (val >> BigInt(64 - off))) & 0xffffffffffffffffn;
    });

    var w = new NBT();
    w.u8(10); w.str(''); // 根
    w.u8(3); w.str('Version'); w.i32(SCHEMATIC_VERSION);
    // Metadata
    w.u8(10); w.str('Metadata');
    w.u8(8); w.str('Name'); w.str('pixel-tree');
    w.u8(8); w.str('Author'); w.str('pixel-tree-qr');
    w.u8(8); w.str('Description'); w.str('Generated by pixel-tree-qr');
    w.u8(3); w.str('RegionCount'); w.i32(1);
    w.u8(4); w.str('TimeCreated'); w.i64(0n);
    w.u8(4); w.str('TimeModified'); w.i64(0n);
    w.u8(3); w.str('TotalBlocks'); w.i32(m.grid.size);
    w.u8(3); w.str('TotalVolume'); w.i32(total);
    w.u8(10); w.str('EnclosingSize');
    w.u8(3); w.str('x'); w.i32(m.sizeX);
    w.u8(3); w.str('y'); w.i32(m.sizeY);
    w.u8(3); w.str('z'); w.i32(m.sizeZ);
    w.u8(0);
    w.u8(0); // Metadata end
    // Regions（根级，与 Metadata 同级）
    w.u8(10); w.str('Regions');
    w.u8(10); w.str('pixel-tree');
    w.u8(10); w.str('Position');
    w.u8(3); w.str('x'); w.i32(0);
    w.u8(3); w.str('y'); w.i32(0);
    w.u8(3); w.str('z'); w.i32(0);
    w.u8(0);
    w.u8(10); w.str('Size');
    w.u8(3); w.str('x'); w.i32(m.sizeX);
    w.u8(3); w.str('y'); w.i32(m.sizeY);
    w.u8(3); w.str('z'); w.i32(m.sizeZ);
    w.u8(0);
    // BlockStatePalette (TAG_List<TAG_Compound>)
    w.u8(9); w.str('BlockStatePalette'); w.u8(10); w.i32(palette.length);
    palette.forEach(function (name) { w.u8(8); w.str('Name'); w.str(name); w.u8(0); });
    // BlockStates (TAG_Long_Array)
    w.u8(12); w.str('BlockStates'); w.i32(longs.length);
    longs.forEach(function (v) { w.i64(v); });
    // 空列表
    ['Entities', 'TileEntities', 'PendingBlockTicks', 'PendingFluidTicks'].forEach(function (nm) {
      w.u8(9); w.str(nm); w.u8(10); w.i32(0);
    });
    w.u8(0); // region end
    w.u8(0); // Regions end
    w.u8(3); w.str('MinecraftDataVersion'); w.i32(DATA_VERSION);
    w.u8(0); // root end

    return w.out();
  }

  function gzipBytes(bytes) {
    var stream = new Blob([bytes]).stream().pipeThrough(new CompressionStream('gzip'));
    return new Response(stream).arrayBuffer();
  }

  downloadProjectionBtn.addEventListener('click', function (e) {
    e.preventDefault();
    ensureBlockMap();
    var missing = leafPalette().filter(function (c) { return !state.blockMap[c.toLowerCase()]; });
    if (missing.length) {
      alert('以下颜色还没有对应方块，请先分配：\n' + missing.join('、'));
      return;
    }
    gzipBytes(buildLitematicBytes()).then(function (buf) {
      var a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([buf], { type: 'application/octet-stream' }));
      a.download = 'pixel-tree.litematic';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(a.href);
    }).catch(function (err) { alert('生成失败：' + err.message); });
  });

  var last = performance.now();
  function frame(now) {
    var dt = Math.min((now - last) / 1000, 0.05);
    last = now;
    var target = state.flat ? 1 : 0;
    state.s += (target - state.s) * Math.min(1, 4.2 * dt);
    if (Math.abs(target - state.s) < 0.001) state.s = target;
    paint(ctx, ease(state.s), now);
    requestAnimationFrame(frame);
  }

  render();
  requestAnimationFrame(frame);
})();

</script>
</body>
</html>
